[build]
  publish = "dist"
  command = "npm run build"

# SPA Fallback: Direct URL routing & manual reload
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache immutable assets with content hashes
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache index.html so users always get fresh releases
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
